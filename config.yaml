auth:
  provider: none
components:
  auto_discovery:
    enabled: true
    ignore_patterns:
    - __pycache__
    - '*.pyc'
    - __init__.py
    scan_directories:
    - tools
    - resources
    - prompts
  prompts: []
  resources: []
  tools: []
management:
  expose_management_tools: false
mcpServers:
  mcp-factory-server:
    command: "uv"
    args: ["run", "python", "server.py"]
    cwd: "/Users/guyue/mcp-factory/workspace/projects/mcp-factory-server"
    auto_start: true
middleware: []
server:
  instructions: This is mcp-factory-platform-server - MCP Factory Platform Management Server - User registration, server creation, and account management
  name: mcp-factory-platform-server
transport:
  host: localhost
  log_level: INFO
  port: 8000
  transport: stdio
